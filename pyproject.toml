[project]
name = "facial-emotion-cnn"
version = "0.1.0"
description = "Facial emotion detection with a CNN, trained on FER2013, deployed as a real-time webcam pipeline"
requires-python = ">=3.11"
dependencies = [
    "tensorflow>=2.16",
    "opencv-python>=4.9",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "kagglehub>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
